# Testing Environment Deployment for Azure Features
# Target: https://showflow-clean.azurewebsites.net/ (Free tier - Testing)
# Use this for testing new Azure-specific features before production

name: Deploy to Testing Environment - showflow-clean

on:
  push:
    branches:
      - testing/azure-features
      - testing/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-testing
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: testing
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-testing
      
      - name: 'Deploy to Testing Environment'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'showflow-clean'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_AC51FEADED534807AE81F2549AA58AC7 }}